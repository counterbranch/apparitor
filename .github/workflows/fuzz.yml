# Atheris fuzzing of the untrusted-input parsers (see fuzz/README.md). A short, bounded run
# on every PR catches input that crashes or hangs a parser; the weekly run digs deeper.
# Atheris ships manylinux wheels for CPython up to 3.11, so the job pins 3.11 (no clang build).
#
# Actions are pinned by commit SHA (Dependabot keeps them current via the version comment).
name: fuzz

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness:
          - fuzz_pdp_response
          - fuzz_url_guard
          - fuzz_tool_calls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Core install only — the fuzzed parsers (client, models, adapters) are
      # LlamaFirewall-free, so no optional extra is needed.
      - run: uv pip install --system -e . atheris==3.0.0
      - name: Fuzz ${{ matrix.harness }}
        run: python fuzz/${{ matrix.harness }}.py -max_total_time=60 -timeout=25
